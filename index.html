<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive To-Do List App</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Italianno&family=Tangerine:wght@400;700&display=swap" rel="stylesheet">
</head>
<body class="bg-mauve-500">
    <main class="m-24 p-3">
        <div class="bg-gray-900/30 p-3">
            <h1 class="text-white font-bold text-3xl text-center">My To-Do List</h1>
        </div>
        <div class="m-8 p-4">
            <label for="taskInput" 
                class="text-white font-mono font-semibold italic ">
                Task<span class="font-normal">:</span>
            </label>
            <input type="text"
                id="taskInput" 
                placeholder="Enter a task" 
                class="bg-white italic p-1"
            >
            <button class="bg-gray-700/30 text-white rounded-lg text-sm px-3 py-1 mt-3 justify-center flex items-center text-center border border-purple-600" 
                onclick="addTask()">
                    Add Task
            </button>
        </div>
        <div class="max-w-full max-h-full bg-white border-l-3 border-dotted border-mauve-500 p-5">
            <h2 class="text-center underline italic font-['Italianno'] text-2xl" >Task List</h2>
            <ul id="taskList">
                
            </ul>
        </div>
    </main>
    <script src="script.js"></script>
</body>
</html>
